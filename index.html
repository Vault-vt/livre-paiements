<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>سجل المدفوعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="shortcut icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2452C8">
<style>
  :root {
    --bg: #F6F7FA; --bg-elevated: #FFFFFF; --ink: #14161C; --ink-soft: #676B76; --ink-faint: #9498A2;
    --line: #E4E6EC; --accent: #2452C8; --accent-ink: #FFFFFF; --accent-soft: #E9EEFC;
    --received: #12805C; --received-soft: #E4F5EE; --paid: #C4432B; --paid-soft: #FBEAE6;
    --shadow: 0 1px 2px rgba(20,22,28,0.04), 0 8px 24px rgba(20,22,28,0.06);
    --radius: 14px; --ctrl-h: 42px;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101114; --bg-elevated: #1A1C21; --ink: #EDEEF2; --ink-soft: #9498A2; --ink-faint: #6B6F79;
      --line: #2A2D34; --accent: #5A82E0; --accent-ink: #0B0D12; --accent-soft: #1C2438;
      --received: #3FBE8E; --received-soft: #132420; --paid: #E58269; --paid-soft: #2A1917;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101114; --bg-elevated: #1A1C21; --ink: #EDEEF2; --ink-soft: #9498A2; --ink-faint: #6B6F79;
    --line: #2A2D34; --accent: #5A82E0; --accent-ink: #0B0D12; --accent-soft: #1C2438;
    --received: #3FBE8E; --received-soft: #132420; --paid: #E58269; --paid-soft: #2A1917;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: pan-x pan-y; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Tajawal', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'Space Mono', monospace; direction: ltr; unicode-bidi: embed; display: inline-block; }
  .app { position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; max-width: 760px; margin: 0 auto; padding: 18px 16px 100px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
  h1 { font-size: 20px; font-weight: 800; margin: 0; }
  .subtitle { color: var(--ink-faint); font-size: 12px; margin-top: 3px; }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: inline-block; margin-inline-end: 5px; }
  .conn-dot.on { background: var(--received); }

  .tabs { display: flex; gap: 3px; background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
  .tab-btn { flex: 1; padding: 9px 4px; border: none; background: none; border-radius: 9px; font-size: 12px; font-weight: 700; color: var(--ink-soft); cursor: pointer; font-family: inherit; white-space: nowrap; }
  .tab-btn.active { background: var(--accent); color: var(--accent-ink); }

  .icn { flex-shrink: 0; color: var(--ink-faint); display: flex; }
  .ctrl-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .ctrl-box { height: var(--ctrl-h); display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-elevated); padding: 0 12px; box-shadow: var(--shadow); }
  .ctrl-box input, .ctrl-box select { border: none; background: none; padding: 0; margin: 0; font-size: 16px; color: var(--ink); font-family: inherit; height: 100%; width: 100%; min-width: 0; }
  .ctrl-box input:focus, .ctrl-box select:focus { outline: none; }
  .ctrl-box:focus-within { border-color: var(--accent); }
  .ctrl-box select { appearance: none; -webkit-appearance: none; cursor: pointer; }
  .ctrl-box.select-box { padding-inline-end: 8px; }
  .ctrl-select-arrow { flex-shrink: 0; color: var(--ink-faint); margin-inline-start: -2px; }
  .ctrl-search { flex: 1 1 100%; margin-bottom: 10px; }
  .ctrl-half { flex: 1; min-width: 0; }
  .ctrl-date-lbl { font-size: 11.5px; color: var(--ink-faint); font-weight: 700; flex-shrink: 0; white-space: nowrap; }

  .filter-clear-row { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .filter-clear { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink-soft); font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; }
  .filter-count { font-size: 12px; color: var(--ink-faint); margin: 0 2px 10px; }

  .search-wrap { position: relative; }
  .search-results { position: absolute; inset-inline: 0; top: calc(100% + 6px); background: var(--bg-elevated); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 20; max-height: 280px; overflow-y: auto; display: none; }
  .search-results.show { display: block; }
  .search-result-row { padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .search-result-row:last-child { border-bottom: none; }
  .search-result-row:hover { background: var(--accent-soft); }

  .section-label { font-size: 12px; color: var(--ink-faint); margin: 18px 0 8px; font-weight: 700; }
  .num-list { display: flex; flex-direction: column; gap: 8px; }
  .num-card { background: var(--bg-elevated); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: var(--shadow); }
  .num-card .left { min-width: 0; }
  .num-card .phone { font-weight: 700; font-size: 14.5px; }
  .num-card .label { color: var(--ink-soft); font-size: 12px; margin-top: 2px; }
  .num-card .right { text-align: end; flex-shrink: 0; margin-inline-start: 12px; }
  .balance { font-weight: 800; font-size: 16px; }
  .balance.pos { color: var(--received); } .balance.neg { color: var(--paid); } .balance.zero { color: var(--ink-faint); }
  .num-card .when { color: var(--ink-faint); font-size: 11px; margin-top: 2px; }

  .empty { text-align: center; padding: 46px 18px; color: var(--ink-faint); }
  .empty .big { font-size: 15.5px; font-weight: 700; color: var(--ink); margin-bottom: 5px; }

  .detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .back-btn { background: var(--bg-elevated); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; width: 34px; height: 34px; font-size: 17px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .detail-title { min-width: 0; flex: 1; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; background: var(--bg-elevated); }
  .detail-title .phone { font-size: 17px; font-weight: 800; }
  .detail-title .label-txt { font-size: 12px; color: var(--ink-soft); margin-top: 2px; min-height: 15px; }
  .detail-title .edit-ic { color: var(--accent); flex-shrink: 0; }
  .balance-banner { background: var(--accent-soft); border-radius: var(--radius); padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .balance-banner .amt { font-size: 24px; font-weight: 800; }
  .balance-banner .meta { text-align: end; font-size: 11.5px; color: var(--ink-soft); }

  .tx-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); gap: 10px; cursor: pointer; border-radius: 8px; }
  .tx-row:hover { background: var(--accent-soft); }
  .tx-row:last-child { border-bottom: none; }
  .tx-left { min-width: 0; }
  .tx-app-row { display: flex; align-items: center; gap: 7px; }
  .tx-app { font-weight: 700; font-size: 13.5px; }
  .tx-number { color: var(--ink-faint); font-size: 11.5px; }
  .tx-meta { color: var(--ink-faint); font-size: 11.5px; margin-top: 2px; }
  .tx-note { color: var(--ink-soft); font-size: 12px; margin-top: 3px; }
  .tx-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .tx-amt { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .tx-amt.receive { color: var(--received); } .tx-amt.pay { color: var(--paid); }
  .tx-chevron { color: var(--ink-faint); flex-shrink: 0; }
  .tx-tag { font-size: 10px; padding: 2px 7px; border-radius: 999px; font-weight: 700; }
  .tx-tag.receive { background: var(--received-soft); color: var(--received); }
  .tx-tag.pay { background: var(--paid-soft); color: var(--paid); }
  .list-more-note { text-align: center; padding: 10px 4px; font-size: 11.5px; font-weight: 700; color: var(--ink-faint); border-top: 1px solid var(--line); }

  .fab { position: fixed; inset-inline-end: 18px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border: none; font-size: 27px; box-shadow: var(--shadow); cursor: pointer; z-index: 30; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(10,11,15,0.5); z-index: 40; display: none; align-items: flex-end; justify-content: center; }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--bg-elevated); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto; }
  .modal-top { display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; margin-bottom: 8px; }
  .modal-drag-zone { cursor: grab; touch-action: none; }
  .modal-drag-zone h2 { touch-action: none; }
  .modal-handle { grid-column: 2; justify-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--line); cursor: grab; padding: 10px 20px; margin: -10px -20px; background-clip: content-box; touch-action: none; }
  .modal.dragging { transition: none !important; }
  .modal-close-x { grid-column: 3; justify-self: end; width: 28px; height: 28px; border-radius: 50%; border: none; background: var(--bg); color: var(--ink-soft); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .modal h2 { font-size: 17px; font-weight: 800; margin: 0 0 15px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 5px; font-weight: 700; }
  .field .readonly-val { padding: 11px 12px; border-radius: 10px; background: var(--bg); color: var(--ink-soft); font-size: 14px; }
  .field input, .field select, .field textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 16px; font-family: inherit; }
  .field input[type="date"] { height: 46px; padding-block: 0; -webkit-appearance: none; appearance: none; }
  .field input[type="date"]::-webkit-date-and-time-value { text-align: start; }
  .field input[type="date"]::-webkit-calendar-picker-indicator { padding: 0; margin-inline-start: 6px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .toggle-row { display: flex; gap: 8px; }
  .toggle-btn { flex: 1; padding: 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .toggle-btn.active-receive { background: var(--received-soft); border-color: var(--received); color: var(--received); }
  .toggle-btn.active-pay { background: var(--paid-soft); border-color: var(--paid); color: var(--paid); }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn { padding: 13px; border-radius: 10px; border: none; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit; flex: 1; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-secondary { background: var(--bg); color: var(--ink-soft); border: 1px solid var(--line); }
  .btn-danger { background: var(--paid); color: #fff; }
  .hint { font-size: 11.5px; color: var(--paid); margin-top: 4px; display: none; }
  .hint.show { display: block; }
  .readonly-note { font-size: 12px; color: var(--accent); background: var(--accent-soft); padding: 9px 13px; border-radius: 10px; margin-bottom: 14px; }

  /* read-only "details" view inside modals */
  .view-amt-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 16px; background: var(--accent-soft); border-radius: var(--radius); margin-bottom: 14px; }
  .view-amt { font-size: 26px; font-weight: 800; }
  .view-amt.receive { color: var(--received); } .view-amt.pay { color: var(--paid); } .view-amt.pos { color: var(--received); } .view-amt.neg { color: var(--paid); } .view-amt.zero { color: var(--ink-faint); }
  .view-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 14px; gap: 10px; }
  .view-row:last-child { border-bottom: none; }
  .view-row-label { color: var(--ink-soft); display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .view-row-val { font-weight: 700; color: var(--ink); text-align: end; }
  .view-note-block { padding: 12px 2px 4px; color: var(--ink-soft); font-size: 13px; line-height: 1.6; }
  .view-note-block .view-row-label { margin-bottom: 4px; }

  .pdf-intro { font-size: 12.5px; color: var(--ink-soft); background: var(--accent-soft); padding: 11px 13px; border-radius: 10px; margin-bottom: 14px; line-height: 1.6; }
  .export-btn { width: 100%; height: 48px; border: none; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; }
  #printArea { display: none; }
  @media print {
    body > *:not(#printAreaWrap) { display: none !important; }
    #printAreaWrap { display: block !important; position: absolute; inset: 0; padding: 24px; font-family: 'Tajawal', sans-serif; }
    #printArea { display: block !important; }
    .print-header { margin-bottom: 14px; border-bottom: 2px solid #2452C8; padding-bottom: 12px; }
    .print-header h2 { margin: 0 0 4px; font-size: 21px; color: #14161C; }
    .print-header .sub { font-size: 12.5px; color: #2452C8; font-weight: bold; margin-bottom: 2px; }
    .print-header .meta { color: #676B76; font-size: 11.5px; line-height: 1.7; }
    .pdf-summary { display: flex; gap: 10px; margin: 16px 0 18px; }
    .pdf-card { flex: 1; border-radius: 10px; padding: 12px 8px; text-align: center; border: 1px solid rgba(0,0,0,0.06); }
    .pdf-card.received { background: #E4F5EE; } .pdf-card.received .val { color: #12805C; }
    .pdf-card.paid { background: #FBEAE6; } .pdf-card.paid .val { color: #C4432B; }
    .pdf-card.net { background: #E9EEFC; } .pdf-card.net .val { color: #2452C8; }
    .pdf-card .val { font-size: 16px; font-weight: 800; }
    .pdf-card .lbl { font-size: 10px; color: #676B76; margin-top: 4px; font-weight: bold; }
    .print-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .print-table th { background: #14161C; color: #fff; padding: 8px 9px; text-align: start; font-weight: bold; }
    .print-table td { padding: 8px 9px; text-align: start; border-bottom: 1px solid #E4E6EC; }
    .print-table tr.receive-row { background: #F3FBF7; border-inline-start: 3px solid #12805C; }
    .print-table tr.pay-row { background: #FDF3F1; border-inline-start: 3px solid #C4432B; }
    .print-table .amt-receive { color: #12805C; font-weight: bold; }
    .print-table .amt-pay { color: #C4432B; font-weight: bold; }
    .print-table .type-pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: bold; }
    .type-pill.receive-row { background: #12805C; color: #fff; }
    .type-pill.pay-row { background: #C4432B; color: #fff; }
    .print-footer { margin-top: 16px; text-align: end; font-weight: bold; font-size: 13px; color: #14161C; }
  }
  #printAreaWrap { display: none; }

  .lang-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .lang-btn { flex: 1; padding: 14px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-elevated); color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: var(--shadow); }
  .lang-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .settings-card { background: var(--bg-elevated); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); }

  .summary-stack { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .summary-card-full { border-radius: 14px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
  .summary-card-full .lbl { font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .summary-card-full .amt { font-weight: 800; font-size: 22px; max-width: 70%; white-space: nowrap; overflow: hidden; }
  .summary-card-full.received { background: var(--received-soft); } .summary-card-full.received .amt { color: var(--received); }
  .summary-card-full.paid { background: var(--paid-soft); } .summary-card-full.paid .amt { color: var(--paid); }
  .summary-card-full.net { background: var(--accent-soft); } .summary-card-full.net .amt { color: var(--accent); }

  .month-picker { display: flex; align-items: center; justify-content: space-between; background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .month-picker button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 17px; cursor: pointer; }
  .month-picker .m-label { font-weight: 800; font-size: 15px; }
  .day-range-lbl { font-size: 11.5px; color: var(--ink-faint); font-weight: 700; flex-shrink: 0; white-space: nowrap; }

  /* feel like a native app, not a selectable webpage */
  * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  input, textarea { -webkit-user-select: text; user-select: text; }

  /* auth gate */
  #authScreen { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-box { width: 100%; max-width: 380px; }
  .auth-logo { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 14px; display: block; box-shadow: var(--shadow); }
  .auth-title { text-align: center; font-size: 19px; font-weight: 800; margin-bottom: 4px; }
  .auth-sub { text-align: center; color: var(--ink-faint); font-size: 12.5px; margin-bottom: 22px; }
  .auth-field { margin-bottom: 12px; }
  .auth-field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 5px; font-weight: 700; }
  .auth-field input { width: 100%; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-elevated); color: var(--ink); font-size: 16px; font-family: inherit; user-select: text; }
  .pw-field-wrap { position: relative; }
  .pw-field-wrap input { padding-inline-end: 42px; }
  .pw-eye-btn { position: absolute; inset-inline-end: 4px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border: none; background: none; color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .pw-eye-btn:hover { background: var(--bg); color: var(--ink-soft); }
  .auth-btn { width: 100%; padding: 13px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 14.5px; font-weight: 700; margin-top: 8px; cursor: pointer; font-family: inherit; }
  .auth-btn:disabled { opacity: 0.6; }
  .auth-switch { text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-top: 16px; }
  .auth-switch a { color: var(--accent); font-weight: 700; text-decoration: none; cursor: pointer; }
  .auth-forgot { text-align: center; font-size: 12px; color: var(--accent); margin-top: 10px; cursor: pointer; font-weight: 700; }
  .auth-err { font-size: 12.5px; color: var(--paid); background: var(--paid-soft); padding: 9px 12px; border-radius: 10px; margin-bottom: 12px; display: none; }
  .auth-err.show { display: block; }
  .auth-msg { font-size: 12.5px; color: var(--received); background: var(--received-soft); padding: 9px 12px; border-radius: 10px; margin-bottom: 12px; display: none; }
  .auth-msg.show { display: block; }
  .account-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 2px 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .account-row .email { font-size: 13px; color: var(--ink-soft); }

  // ===== auth =====
  let authMode = 'signin';
  function mapAuthError(code) {
    const map = { 'auth/invalid-email':'errInvalidEmail', 'auth/user-not-found':'errUserNotFound', 'auth/wrong-password':'errWrongPassword',
      'auth/invalid-credential':'errWrongPassword', 'auth/email-already-in-use':'errEmailInUse', 'auth/weak-password':'errWeakPassword',
      'auth/too-many-requests':'errTooManyRequests' };
    return t(map[code] || 'errGeneric');
  }
  function updateAuthUI() {
    $('authTitle').textContent = authMode === 'signin' ? t('authSignInTitle') : t('authSignUpTitle');
    $('authSubmitBtn').textContent = authMode === 'signin' ? t('authSignIn') : t('authCreateAccount');
    $('authSwitchLine').innerHTML = authMode === 'signin'
      ? escapeHtml(t('authNoAccount')) + ' <a id="authSwitchLink">' + escapeHtml(t('authCreateAccount')) + '</a>'
      : escapeHtml(t('authHaveAccount')) + ' <a id="authSwitchLink">' + escapeHtml(t('authSignIn')) + '</a>';
    $('authForgot').style.display = authMode === 'signin' ? 'block' : 'none';
    $('authConfirmField').style.display = authMode === 'signup' ? 'block' : 'none';
    $('authSwitchLink').addEventListener('click', () => {
      authMode = authMode === 'signin' ? 'signup' : 'signin';
      $('authErr').classList.remove('show'); $('authMsg').classList.remove('show');
      $('authPasswordConfirm').value = '';
      updateAuthUI();
    });
  }
  $('authSubmitBtn').addEventListener('click', async () => {
    const email = $('authEmail').value.trim();
    const pass = $('authPassword').value;
    $('authErr').classList.remove('show'); $('authMsg').classList.remove('show');
    if (!email || !pass) { $('authErr').textContent = t('errGeneric'); $('authErr').classList.add('show'); return; }
    if (authMode === 'signup') {
      const confirm = $('authPasswordConfirm').value;
      if (pass !== confirm) { $('authErr').textContent = t('errPasswordMismatch'); $('authErr').classList.add('show'); return; }
    }
    $('authSubmitBtn').disabled = true;
    try {
      if (authMode === 'signin') { await firebase.auth().signInWithEmailAndPassword(email, pass); }
      else { await firebase.auth().createUserWithEmailAndPassword(email, pass); }
    } catch (e) {
      $('authErr').textContent = mapAuthError(e.code); $('authErr').classList.add('show');
    } finally { $('authSubmitBtn').disabled = false; }
  });
  $('authForgot').addEventListener('click', async () => {
    const email = $('authEmail').value.trim();
    $('authErr').classList.remove('show'); $('authMsg').classList.remove('show');
    if (!email) { $('authErr').textContent = t('authEnterEmailFirst'); $('authErr').classList.add('show'); return; }
    try {
      await firebase.auth().sendPasswordResetEmail(email);
      $('authMsg').textContent = t('authResetSent'); $('authMsg').classList.add('show');
    } catch (e) { $('authErr').textContent = mapAuthError(e.code); $('authErr').classList.add('show'); }
  });
  $('signOutBtn').addEventListener('click', () => firebase.auth().signOut());
  $('resetPwBtn').addEventListener('click', async () => {
    const user = firebase.auth().currentUser;
    if (!user || !user.email) return;
    $('resetPwMsg').classList.remove('show');
    try {
      await firebase.auth().sendPasswordResetEmail(user.email);
      $('resetPwMsg').textContent = t('resetPwSent');
      $('resetPwMsg').classList.add('show');
    } catch (e) { alert(mapAuthError(e.code)); }
  });

  async function init() {
    $('mDate').value = todayStr();
    document.getElementById('htmlRoot').setAttribute('lang', lang);
    document.getElementById('htmlRoot').setAttribute('dir', DICT[lang].dir);
    translateAll();
    updateAuthUI();
    db = firebase.firestore();
    // Offline persistence: once signed in, whatever's already been synced stays
    // readable from local cache with no connection — same as the other apps.
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        myId = user.uid;
        $('authScreen').style.display = 'none';
        $('accountEmail').textContent = user.email || '';
        setConn(true, 'connected');
        // Fresh session, even if this is a different account signing in on the
        // same device right after another one signed out: don't carry over
        // whatever tab or leftover message the previous account left behind.
        $('resetPwMsg').classList.remove('show');
        currentPhone = null;
        switchTab('tx');
        subscribeNumbers();
        subscribeAllTx();
      } else {

  function matchesFilters(row, f) {
    if (f.number && !(row.number || '').includes(f.number)) return false;
    if (f.type && row.type !== f.type) return false;
    if (f.app && row.app !== f.app) return false;

    if (f.to && (row.date || '') > f.to) return false;
    return true;
  }
  function computeSums(rows) {
    let received = 0, paid = 0;
    rows.forEach((r) => { if (r.type === 'receive') received += (r.amount || 0); else paid += (r.amount || 0); });
    return { received, paid, net: received - paid };
  }
  function fitText(el) {
    if (!el) return;
    el.style.fontSize = '';
    const cs = getComputedStyle(el);
    let size = parseFloat(cs.fontSize);
    const maxWidth = el.parentElement.clientWidth * (parseFloat(cs.maxWidth) / 100 || 0.7);
    while (el.scrollWidth > maxWidth && size > 12) {
      size -= 1;
      el.style.fontSize = size + 'px';
    }
  }
  function paintSums(prefix, rows) {
    const s = computeSums(rows);
    $(prefix + 'Received').textContent = fmt(s.received);

    [$(prefix + 'Received'), $(prefix + 'Paid'), $(prefix + 'Net')].forEach(fitText);
  }

    const newId = sanitizeId(rawNumber);

    $('enNumberHint').classList.remove('show');
    enSaving = true; $('numSaveBtnEdit').textContent = t('editing');

    try {
      if (newId === oldId) { await numbersCol().doc(oldId).update({ display: rawNumber, label: newLabel }); }
      else {
        const oldSnap = await numbersCol().doc(oldId).get();
        const oldData = oldSnap.exists ? oldSnap.data() : { balance: 0, count: 0, lastAt: Date.now() };
        const txSnap = await txCol().where('number', '==', oldId).get();
        for (const d of txSnap.docs) { await d.ref.update({ number: newId, display: rawNumber }); }
        const destSnap = await numbersCol().doc(newId).get();
        const destData = destSnap.exists ? destSnap.data() : { balance: 0, count: 0, lastAt: 0 };
        const merged = { display: rawNumber, label: newLabel || destData.label || '', balance: (destData.balance||0)+(oldData.balance||0), count: (destData.count||0)+(oldData.count||0), lastAt: Math.max(destData.lastAt||0, oldData.lastAt||0) };
        if (destSnap.exists) { await numbersCol().doc(newId).update(merged); } else { await numbersCol().doc(newId).set(merged); }
        await numbersCol().doc(oldId).delete();
        currentPhone = newId;

  async function adjustNumberBalance(id, deltaBalance, deltaCount, display) {
    const ref = numbersCol().doc(id);
    const snap = await ref.get();
    if (snap.exists) { const cur = snap.data(); await ref.update({ balance: (cur.balance||0)+deltaBalance, count: Math.max(0,(cur.count||0)+deltaCount), lastAt: Date.now() }); }
    else if (deltaCount > 0) { await ref.set({ display: display || id, label: '', balance: deltaBalance, count: deltaCount, lastAt: Date.now() }); }
  }

  $('saveBtnAdd').addEventListener('click', async () => {
    if (!db) return;
    const amount = parseFloat($('mAmount').value);
    if (!amount || amount <= 0) { $('mAmount').focus(); return; }

    const id = sanitizeId(rawNumber);
    if (!id || id.length < 6) { $('numberHint').classList.add('show'); return; }
    $('numberHint').classList.remove('show');
    const app = $('mApp').value, date = $('mDate').value || todayStr(), note = $('mNote').value.trim();
    $('saveBtnAdd').textContent = t('saving');
    const now = Date.now();
    try {
      await txCol().add({ number: id, display: rawNumber, type: txType, amount, app, date, note, createdAt: now, createdBy: myId || null });
      const delta = txType === 'receive' ? amount : -amount;
      await adjustNumberBalance(id, delta, 1, rawNumber);
      closeModal();
    } catch (e) { alert(t('errorSave')); }
    finally { $('saveBtnAdd').textContent = t('save'); }
  });

  $('saveBtnEdit').addEventListener('click', async () => {
    if (!editTxId) return;
    const amount = parseFloat($('mAmount').value);
    if (!amount || amount <= 0) { $('mAmount').focus(); return; }
    const app = $('mApp').value, date = $('mDate').value || todayStr(), note = $('mNote').value.trim();
    $('saveBtnEdit').textContent = t('editing');
    try {
      const txRef = txCol().doc(editTxId);
      const old = editTxOriginal;
      const oldDelta = old.type === 'receive' ? (old.amount||0) : -(old.amount||0);
      const newDelta = txType === 'receive' ? amount : -amount;
      const updated = { ...old, type: txType, amount, app, date, note };
      await txRef.update({ type: txType, amount, app, date, note });
      await adjustNumberBalance(old.number, newDelta - oldDelta, 0, old.display);
      editTxOriginal = updated;
      renderTxViewBlock(updated); showTxView(); $('txModalTitle').textContent = t('transactionDetails'); setTxFooter('view');
    } catch (e) { alert(t('errorEdit')); }
    finally { $('saveBtnEdit').textContent = t('edit'); }
  });

  $('confirmDeleteBtn').addEventListener('click', async () => {
    if (!editTxId) return;
    $('confirmDeleteBtn').textContent = t('deleting');
    try {
      const old = editTxOriginal;
      await txCol().doc(editTxId).delete();
      const oldDelta = old.type === 'receive' ? (old.amount||0) : -(old.amount||0);
      await adjustNumberBalance(old.number, -oldDelta, -1, old.display);
      closeModal();
    } catch (e) { alert(t('errorDelete')); }
    finally { $('confirmDeleteBtn').textContent = t('confirmDelete'); }
  });

  // ===== MONTHLY TAB =====
  const MONTH_NAMES = {
    ar: ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],
    fr: ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'],
    en: ['January','February','March','April','May','June','July','August','September','October','November','December']
  };
  const today0 = new Date();
  let monthState = { year: today0.getFullYear(), month: today0.getMonth() };

  function monthLabel() { return MONTH_NAMES[lang][monthState.month] + ' ' + monthState.year; }
  function daysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }
  function currentMonthFilters() {
    const lastDay = daysInMonth(monthState.year, monthState.month);
    const dayFromRaw = parseInt($('mfDayFrom').value, 10);
    const dayToRaw = parseInt($('mfDayTo').value, 10);
    const dayFrom = (dayFromRaw >= 1 && dayFromRaw <= 31) ? Math.min(dayFromRaw, lastDay) : 1;
    const dayTo = (dayToRaw >= 1 && dayToRaw <= 31) ? Math.min(dayToRaw, lastDay) : lastDay;
    const ym = monthState.year + '-' + pad2(monthState.month + 1);
    return {
      number: sanitizeId($('mfNumber').value), type: $('mfType').value, app: $('mfApp').value,
      from: ym + '-' + pad2(Math.min(dayFrom, dayTo)), to: ym + '-' + pad2(Math.max(dayFrom, dayTo))
    };
  }
  function renderMonthTab() {
    $('mMonthLabel').textContent = monthLabel();
    $('mExportLabel').textContent = t('exportBtn') + ' — ' + monthLabel();
    const f = currentMonthFilters();
    const rows = allTx.filter((r) => matchesFilters(r, f));
    paintSums('mSum', rows);
    $('mCount').textContent = t('txCount', rows.length);
    if (rows.length === 0) { $('mList').innerHTML = ''; $('mEmpty').style.display = 'block'; return; }
    $('mEmpty').style.display = 'none';
    $('mList').innerHTML = rows.slice(0, 7).map(rowHtml).join('') + moreFooterHtml(rows.length - 7);
    $('mList').querySelectorAll('.tx-row').forEach((el) => el.addEventListener('click', () => openViewTx(el.dataset.id, allTx.find(r => r.id === el.dataset.id))));
  }
  $('mPrevBtn').addEventListener('click', () => {
    monthState.month--; if (monthState.month < 0) { monthState.month = 11; monthState.year--; }
    renderMonthTab();
  });
  $('mNextBtn').addEventListener('click', () => {
    monthState.month++; if (monthState.month > 11) { monthState.month = 0; monthState.year++; }
    renderMonthTab();
  });
  $('mfNumber').addEventListener('input', renderMonthTab);
  $('mfType').addEventListener('change', renderMonthTab);
  $('mfApp').addEventListener('change', renderMonthTab);
  $('mfDayFrom').addEventListener('input', renderMonthTab);
  $('mfDayTo').addEventListener('input', renderMonthTab);
  $('mfClear').addEventListener('click', () => {
    $('mfNumber').value = ''; $('mfType').value = ''; $('mfApp').value = ''; $('mfDayFrom').value = ''; $('mfDayTo').value = '';
    renderMonthTab();
  });
  $('mExportBtn').addEventListener('click', () => exportFilteredPdf(currentMonthFilters()));

  // ===== PDF TAB =====


  function currentPdfFilters() { return { number: sanitizeId($('pfNumber').value), type: $('pfType').value, app: $('pfApp').value, from: $('pfFrom').value, to: $('pfTo').value }; }
  function renderPdfCount() {
    const f = currentPdfFilters();
    const rows = allTx.filter((r) => matchesFilters(r, f));
    $('pfCount').textContent = t('txCount', rows.length);
    if (rows.length === 0) {
      $('pfPreviewList').innerHTML = '';
      $('pfPreviewEmpty').style.display = 'block';
      return;
    }
    $('pfPreviewEmpty').style.display = 'none';
    $('pfPreviewList').innerHTML = rows.slice(0, 7).map(rowHtml).join('') + moreFooterHtml(rows.length - 7);
  }
  $('pfNumber').addEventListener('input', renderPdfCount);
  $('pfType').addEventListener('change', renderPdfCount);
  $('pfApp').addEventListener('change', renderPdfCount);
  $('pfFrom').addEventListener('change', renderPdfCount);
  $('pfTo').addEventListener('change', renderPdfCount);

  function exportFilteredPdf(f) {
    const rows = allTx.filter((r) => matchesFilters(r, f)).sort((a,b) => (a.date||'').localeCompare(b.date||''));
    const filterParts = [];
    if (f.number) filterParts.push(t('phoneNumber') + ': ' + f.number);
    if (f.type) filterParts.push(t('type') + ': ' + (f.type === 'receive' ? t('received') : t('paid')));
    if (f.app) filterParts.push(t('appOrMethod') + ': ' + appLabel(f.app));
    if (f.from) filterParts.push(t('fromDate') + ': ' + dateFmtDisplay(f.from));
    if (f.to) filterParts.push(t('toDate') + ': ' + dateFmtDisplay(f.to));
    const filtersTxt = filterParts.length ? filterParts.join(' · ') : t('printNone');
    const now = new Date();
    const genStr = pad2(now.getDate()) + '/' + pad2(now.getMonth()+1) + '/' + now.getFullYear();

    const uniqueNumbers = new Set(rows.map((r) => r.number));
    const isSingle = rows.length > 0 && uniqueNumbers.size === 1;
    let titleHtml = escapeHtml(t('printTitle'));
    let subHtml = '';
    if (isSingle) {
      const numId = rows[0].number;
      const info = numbersData[numId] || {};
      subHtml = `<div class="sub"><span class="mono">${escapeHtml(info.display || rows[0].display || numId)}</span>${info.label ? ' · ' + escapeHtml(info.label) : ''}</div>`;
    }

    const sums = computeSums(rows);
    const summaryHtml = `<div class="pdf-summary">
      <div class="pdf-card received"><div class="val mono">${fmt(sums.received)}</div><div class="lbl">${t('received')}</div></div>
      <div class="pdf-card paid"><div class="val mono">${fmt(sums.paid)}</div><div class="lbl">${t('paid')}</div></div>
      <div class="pdf-card net"><div class="val mono">${sums.net >= 0 ? '+' : ''}${fmt(sums.net)}</div><div class="lbl">${t('netTotal')}</div></div>
    </div>`;

    let bodyHtml;
    if (rows.length === 0) {
      bodyHtml = summaryHtml + `<p class="empty-msg">${escapeHtml(t('pdfNoResults'))}</p>`;
    } else {
      const headCols = isSingle
        ? `<th>${t('colDate')}</th><th>${t('colApp')}</th><th>${t('colType')}</th><th>${t('colAmount')}</th><th>${t('colNote')}</th>`
        : `<th>${t('colDate')}</th><th>${t('colNumber')}</th><th>${t('colApp')}</th><th>${t('colType')}</th><th>${t('colAmount')}</th><th>${t('colNote')}</th>`;
      const trs = rows.map((r) => {
        const isReceive = r.type === 'receive';
        const rowCls = isReceive ? 'receive-row' : 'pay-row';
        const numberCell = isSingle ? '' : `<td>${escapeHtml(r.display || r.number)}</td>`;
        return `<tr class="${rowCls}">
          <td>${dateFmtDisplay(r.date)}</td>
          ${numberCell}
          <td>${escapeHtml(appLabel(r.app) || r.app)}</td>
          <td><span class="type-pill ${rowCls}">${isReceive ? t('received') : t('paid')}</span></td>
          <td class="${isReceive ? 'amt-receive' : 'amt-pay'} mono">${isReceive ? '+' : '−'}${fmt(r.amount||0)}</td>
          <td>${escapeHtml(r.note || '')}</td>
        </tr>`;
      }).join('');
      bodyHtml = summaryHtml + `<table class="print-table"><thead><tr>${headCols}</tr></thead><tbody>${trs}</tbody></table>
      <div class="print-footer">${t('printCount', rows.length)}</div>`;
    }

    openPdfDoc({ titleHtml, subHtml, genStr, filtersTxt, bodyHtml });
  }
  $('pfExportBtn').addEventListener('click', () => exportFilteredPdf(currentPdfFilters()));

  // Opens the export as a standalone document in its own real browser tab —
  // own <html dir>, own font load, nothing from the live app underneath to
  // hide or fight with. The person taps the Print/Save button themselves
  // once they can see the page actually rendered, instead of the print
  // dialog firing blind on top of the live app.
  function openPdfDoc({ titleHtml, subHtml, genStr, filtersTxt, bodyHtml }) {
    const w = window.open('', '_blank');
    if (!w) { alert(t('errGeneric')); return; }
    const dir = DICT[lang].dir;
    const html = `<!DOCTYPE html>
<html dir="${dir}" lang="${lang}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${titleHtml}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: text; user-select: text; }
  body { font-family: 'Tajawal', sans-serif; background: #EEF0F4; color: #14161C; padding: 0 0 60px; }
  .mono { font-family: 'Space Mono', monospace; direction: ltr; unicode-bidi: embed; display: inline-block; }
  .topbar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid #E4E6EC;
  }
  .topbar button {
    height: 38px; border: none; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 13.5px; cursor: pointer;
  }
  .topbar .close-btn { width: 38px; background: #fff; border: 1px solid #E4E6EC; color: #676B76; }
  .topbar .print-btn { padding: 0 18px; background: #2452C8; color: #fff; display: flex; align-items: center; gap: 7px; }
  .doc { max-width: 640px; margin: 18px auto 0; background: #fff; border-radius: 14px; box-shadow: 0 10px 30px rgba(20,22,28,0.08); padding: 24px 22px; }
  .print-header { margin-bottom: 14px; border-bottom: 2px solid #2452C8; padding-bottom: 12px; }
  .print-header h2 { font-size: 20px; }
  .print-header .sub { font-size: 12.5px; color: #2452C8; font-weight: bold; margin: 4px 0 2px; }
  .print-header .meta { color: #676B76; font-size: 11.5px; line-height: 1.7; margin-top: 4px; }
  .pdf-summary { display: flex; gap: 10px; margin: 16px 0 18px; }
  .pdf-card { flex: 1; border-radius: 10px; padding: 12px 8px; text-align: center; border: 1px solid rgba(0,0,0,0.06); }
  .pdf-card.received { background: #E4F5EE; } .pdf-card.received .val { color: #12805C; }
  .pdf-card.paid { background: #FBEAE6; } .pdf-card.paid .val { color: #C4432B; }
  .pdf-card.net { background: #E9EEFC; } .pdf-card.net .val { color: #2452C8; }
  .pdf-card .val { font-size: 16px; font-weight: 800; }
  .pdf-card .lbl { font-size: 10px; color: #676B76; margin-top: 4px; font-weight: bold; }
  .print-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .print-table th { background: #14161C; color: #fff; padding: 8px 9px; text-align: start; font-weight: bold; }
  .print-table td { padding: 8px 9px; text-align: start; border-bottom: 1px solid #E4E6EC; }
  .print-table tr.receive-row { background: #F3FBF7; border-inline-start: 3px solid #12805C; }
  .print-table tr.pay-row { background: #FDF3F1; border-inline-start: 3px solid #C4432B; }
  .print-table .amt-receive { color: #12805C; font-weight: bold; }
  .print-table .amt-pay { color: #C4432B; font-weight: bold; }
  .type-pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: bold; color: #fff; }
  .type-pill.receive-row { background: #12805C; } .type-pill.pay-row { background: #C4432B; }
  .print-footer { margin-top: 16px; text-align: end; font-weight: bold; font-size: 13px; }
  .empty-msg { padding: 30px 0; text-align: center; color: #676B76; }
  @media print {
    .topbar { display: none !important; }
    body { background: #fff; padding: 0; }
    .doc { box-shadow: none; margin: 0; max-width: 100%; border-radius: 0; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <button class="close-btn" onclick="window.close()">✕</button>
    <button class="print-btn" onclick="window.print()">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h9l3 3v4"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
      ${escapeHtml(t('exportBtn'))}
    </button>
  </div>
  <div class="doc">
    <div class="print-header">
      <h2>${titleHtml}</h2>${subHtml}
      <div class="meta">${t('printGenerated')}: ${genStr}<br>${t('printFilters')}: ${escapeHtml(filtersTxt)}</div>
    </div>
    ${bodyHtml}
  </div>
</body>
</html>`;
    w.document.open();
    w.document.write(html);
    w.document.close();
  }

  // ===== drag-to-dismiss on modal header (handle + title), touch-based =====
  // Mirrors the pattern already proven in the other apps: real touchstart/
  // touchmove/touchend (not pointer events) on the whole header block, not
  // just the thin handle bar, so it's actually easy to grab. A plain tap
  // (no real drag) is left alone so the ✕ button's own click still fires.
  function setupDragToClose(zoneId, backdropId, closeFn) {
    const zone = $(zoneId);
    const backdrop = $(backdropId);
    const modalEl = backdrop.querySelector('.modal');
    let startY = 0, dy = 0, dragging = false;

    zone.addEventListener('touchstart', (e) => {
      dragging = true; startY = e.touches[0].clientY; dy = 0;
      modalEl.style.transition = 'none';
    }, { passive: true });

    zone.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      dy = Math.max(0, e.touches[0].clientY - startY);
      modalEl.style.transform = 'translateY(' + dy + 'px)';
    }, { passive: false });

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      modalEl.style.transition = 'transform 0.22s ease';
      if (dy > 5 && e && e.cancelable) e.preventDefault();
      if (dy > 90) {
        modalEl.style.transform = 'translateY(100%)';
        setTimeout(() => { modalEl.style.transform = ''; modalEl.style.transition = ''; closeFn(); }, 200);
      } else {
        modalEl.style.transform = '';
        setTimeout(() => { modalEl.style.transition = ''; }, 220);
      }
      dy = 0;
    }
    zone.addEventListener('touchend', endDrag, { passive: false });
    zone.addEventListener('touchcancel', endDrag, { passive: false });
  }
  setupDragToClose('txDragZone', 'modalBackdrop', closeModal);
  setupDragToClose('numDragZone', 'numModalBackdrop', closeNumModal);

  // ===== contain scrolling inside each modal's own content =====
  // Stops the sheet from rubber-banding the page behind it when you hit the
  // top or bottom while scrolling inside it (overscroll-behavior isn't used
  // on purpose — it's caused single-finger scroll issues on some Android
  // browsers in other apps built this same way).
  function containRubberBand(modalSelector) {
    document.querySelectorAll(modalSelector).forEach((el) => {
      let startY = 0;
      el.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; }, { passive: true });
      el.addEventListener('touchmove', (e) => {
        const delta = e.touches[0].clientY - startY;
        const atTop = el.scrollTop <= 0;
        const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
        if ((atTop && delta > 0) || (atBottom && delta < 0)) { e.preventDefault(); }
      }, { passive: false });
    });
  }
  containRubberBand('.modal');

  init();
})();
</script>
</body>
</html>
